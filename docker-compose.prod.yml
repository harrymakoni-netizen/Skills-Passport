# Production-style stack. Provide secrets through an env file (never commit it):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  api:
    build: { context: ., target: api }
    env_file: .env.production
    environment: { NODE_ENV: production }
    ports: ['4000:4000']
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    env_file: .env.production
    environment: { NODE_ENV: production }
    restart: unless-stopped
  web:
    build: { context: ., target: web, args: { API_INTERNAL_URL: 'http://api:4000' } }
    env_file: .env.production
    environment: { NODE_ENV: production, API_INTERNAL_URL: 'http://api:4000' }
    ports: ['3000:3000']
    depends_on: [api]
    restart: unless-stopped
